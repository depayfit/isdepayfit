<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shot Roulette</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:radial-gradient(circle at top,#3a2200,#080808 60%);
  color:white;
  text-align:center;
  padding:18px;
}
h1{color:#ffcc33;text-shadow:0 0 15px #ffcc33;}
textarea{
  width:100%;
  max-width:390px;
  padding:15px;
  border-radius:14px;
  border:2px solid #ffcc33;
  background:#181818;
  color:white;
  font-size:18px;
}
button{
  margin-top:18px;
  padding:17px 30px;
  border:none;
  border-radius:999px;
  background:linear-gradient(#fff2a8,#ffbf00);
  font-size:22px;
  font-weight:900;
}
.hidden{display:none;}
.stage{
  display:flex;
  flex-direction:column;
  gap:18px;
  align-items:center;
}
.card{
  border:2px solid #ffcc33;
  border-radius:24px;
  padding:14px;
  background:#111;
  max-width:370px;
  width:100%;
}
canvas{
  width:300px;
  height:300px;
  border-radius:50%;
}
.wrap{position:relative;}
.pointer{
  position:absolute;
  top:-5px;
  left:50%;
  transform:translateX(-50%);
  border-left:18px solid transparent;
  border-right:18px solid transparent;
  border-top:42px solid #ffdf57;
  z-index:5;
}
.result{
  font-size:28px;
  font-weight:900;
  margin-top:22px;
  min-height:90px;
}
@media(min-width:820px){
  .stage{flex-direction:row;justify-content:center;}
}
</style>
</head>

<body>

<div id="namesPage">
  <h1>🥃 Shot Roulette</h1>
  <p>Vul namen of voorletters in.</p>

  <textarea id="playersInput" rows="5" placeholder="Bijvoorbeeld: Roberto, Mike, T, K"></textarea>
  <br>
  <button onclick="startGame()">START ROULETTE</button>

  <p style="color:#aaa;margin-top:25px;">Tip: snel in de kroeg? Gebruik alleen voorletters.</p>
</div>

<div id="wheelPage" class="hidden">
  <h1>🎰 Shot Casino</h1>

  <div class="stage">
    <div class="card">
      <h3>WIE BETAALT?</h3>
      <div class="wrap">
        <div class="pointer"></div>
        <canvas id="playerWheel" width="700" height="700"></canvas>
      </div>
    </div>

    <div class="card">
      <h3>WELK SHOTJE?</h3>
      <div class="wrap">
        <div class="pointer"></div>
        <canvas id="shotWheel" width="700" height="700"></canvas>
      </div>
    </div>
  </div>

  <button id="spinBtn" onclick="spin()">DRAAIEN</button>
  <br>
  <button onclick="backToNames()" style="font-size:16px;background:#333;color:white;">Namen aanpassen</button>

  <div id="result" class="result">Laat het lot beslissen.</div>
</div>

<div id="adminPage" class="hidden">
  <h1>🔧 Backoffice</h1>
  <p>Shotjes beheren</p>

  <textarea id="shotsInput" rows="8" placeholder="Tequila, Flügel, Jägermeister, Sambuca"></textarea>
  <br>
  <button onclick="saveShots()">OPSLAAN</button>

  <div id="adminResult" class="result"></div>
</div>

<script>
const defaultShots=["Tequila","Flügel","Jägermeister","Sambuca","Vodka","Dropshot"];
const colors=["#ffcc33","#d41414","#111111","#ffffff","#ff7a00","#8a2be2","#00c2ff","#00d084"];

let players=[];
let playerRot=0;
let shotRot=0;
let spinning=false;

const playerCanvas=document.getElementById("playerWheel");
const shotCanvas=document.getElementById("shotWheel");

function getShots(){
  try{
    const saved=localStorage.getItem("shotjes");
    if(!saved) return defaultShots;
    const arr=JSON.parse(saved);
    return Array.isArray(arr)&&arr.length?arr:defaultShots;
  }catch(e){
    return defaultShots;
  }
}

function startGame(){
  players=document.getElementById("playersInput").value
    .split(",")
    .map(x=>x.trim())
    .filter(Boolean);

  if(players.length<2){
    alert("Vul minimaal 2 spelers in.");
    return;
  }

  document.getElementById("namesPage").classList.add("hidden");
  document.getElementById("wheelPage").classList.remove("hidden");
  drawAll();
}

function backToNames(){
  document.getElementById("wheelPage").classList.add("hidden");
  document.getElementById("namesPage").classList.remove("hidden");
}

function drawWheel(canvas,items,rotation,label){
  const ctx=canvas.getContext("2d");
  const size=canvas.width;
  const c=size/2;
  const r=c-55;
  const slice=Math.PI*2/items.length;

  ctx.clearRect(0,0,size,size);
  ctx.save();
  ctx.translate(c,c);

  ctx.beginPath();
  ctx.arc(0,0,c-15,0,Math.PI*2);
  ctx.fillStyle="#050505";
  ctx.fill();

  for(let i=0;i<34;i++){
    const a=i*Math.PI*2/34;
    ctx.beginPath();
    ctx.arc(Math.cos(a)*(c-28),Math.sin(a)*(c-28),7,0,Math.PI*2);
    ctx.fillStyle=i%2?"#ffcc33":"#fff2a8";
    ctx.fill();
  }

  ctx.beginPath();
  ctx.arc(0,0,r+28,0,Math.PI*2);
  ctx.fillStyle="#d99b00";
  ctx.fill();

  ctx.rotate(rotation);

  for(let i=0;i<items.length;i++){
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.arc(0,0,r,i*slice,(i+1)*slice);
    ctx.closePath();
    ctx.fillStyle=colors[i%colors.length];
    ctx.fill();
    ctx.strokeStyle="#ffdf57";
    ctx.lineWidth=5;
    ctx.stroke();

    ctx.save();
    ctx.rotate(i*slice+slice/2);
    ctx.textAlign="right";
    ctx.fillStyle=colors[i%colors.length]==="#111111"?"#ffcc33":"#111";
    ctx.font=items.length>6?"bold 32px Arial":"bold 42px Arial";
    ctx.fillText(items[i].toUpperCase().slice(0,12),r-30,12);
    ctx.restore();
  }

  ctx.restore();

  ctx.save();
  ctx.translate(c,c);
  ctx.beginPath();
  ctx.arc(0,0,75,0,Math.PI*2);
  ctx.fillStyle="#050505";
  ctx.fill();
  ctx.lineWidth=9;
  ctx.strokeStyle="#ffcc33";
  ctx.stroke();
  ctx.fillStyle="#ffcc33";
  ctx.font="bold 32px Arial";
  ctx.textAlign="center";
  ctx.fillText(label,0,10);
  ctx.restore();
}

function drawAll(){
  drawWheel(playerCanvas,players.length?players:["R","M","T","K"],playerRot,"WIE");
  drawWheel(shotCanvas,getShots(),shotRot,"SHOT");
}

function animateWheel(startRot,winnerIndex,total,duration,onUpdate,onDone){
  const sliceDeg=360/total;
  const pointerDeg=270;
  const winnerDeg=winnerIndex*sliceDeg+sliceDeg/2;
  const targetDeg=pointerDeg-winnerDeg;
  const finalDeg=7*360+targetDeg;
  const endRot=startRot+finalDeg*Math.PI/180;
  const start=performance.now();

  function frame(now){
    const p=Math.min((now-start)/duration,1);
    const ease=1-Math.pow(1-p,4);
    const rot=startRot+(endRot-startRot)*ease;
    onUpdate(rot);

    if(p<1){
      requestAnimationFrame(frame);
    }else{
      onDone(rot);
    }
  }

  requestAnimationFrame(frame);
}

function spin(){
  if(spinning) return;

  spinning=true;
  document.getElementById("spinBtn").disabled=true;
  document.getElementById("result").innerHTML="🎰 De raderen draaien...";

  const shots=getShots();
  const playerWin=Math.floor(Math.random()*players.length);
  const shotWin=Math.floor(Math.random()*shots.length);

  let done1=false;
  let done2=false;

  animateWheel(playerRot,playerWin,players.length,3600,
    rot=>{playerRot=rot;drawAll();},
    rot=>{playerRot=rot;done1=true;finish();}
  );

  setTimeout(()=>{
    animateWheel(shotRot,shotWin,shots.length,4100,
      rot=>{shotRot=rot;drawAll();},
      rot=>{shotRot=rot;done2=true;finish();}
    );
  },400);

  function finish(){
    if(!done1||!done2) return;

    spinning=false;
    document.getElementById("spinBtn").disabled=false;
    document.getElementById("result").innerHTML=
      `🥃 ${shots[shotWin].toUpperCase()}!<br>💸 ${players[playerWin].toUpperCase()} BETAALT`;
  }
}

function saveShots(){
  const shots=document.getElementById("shotsInput").value
    .split(",")
    .map(x=>x.trim())
    .filter(Boolean);

  if(!shots.length){
    document.getElementById("adminResult").innerHTML="Vul minimaal 1 shotje in.";
    return;
  }

  localStorage.setItem("shotjes",JSON.stringify(shots));
  document.getElementById("adminResult").innerHTML="✅ Opgeslagen.";
}

if(location.hash==="#admin"){
  document.getElementById("namesPage").classList.add("hidden");
  document.getElementById("adminPage").classList.remove("hidden");
  document.getElementById("shotsInput").value=getShots().join(", ");
}
</script>

</body>
</html>
