<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Is Memphis Depay Fit?</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: black;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      overflow-x: hidden;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
      color: orange;
    }

    .card {
      background: #111;
      border: 3px solid orange;
      border-radius: 20px;
      overflow: hidden;
      width: 90%;
      max-width: 520px;
      box-shadow: 0 0 30px rgba(255,165,0,0.3);
    }

    img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      display: block;
    }

    .status {
  font-size: 140px;
  font-weight: bold;
  margin-top: 20px;
  animation: pulse 1.5s infinite;
}

.sound {
  font-size: 24px;
  color: orange;
  font-weight: bold;
  margin-top: 10px;
}

    .info {
      margin-top: 20px;
      opacity: 0.8;
      line-height: 1.6;
      padding-bottom: 10px;
    }

    .buttons {
      margin: 25px 0;
    }

    button {
      border: none;
      padding: 18px 30px;
      margin: 10px;
      border-radius: 16px;
      font-size: 24px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .yes {
      background: green;
      color: white;
    }

    .no {
      background: red;
      color: white;
    }

    button:hover {
      transform: scale(1.05);
    }

   .footer {
  margin-top: 8px;
  font-size: 12px;
  opacity: 0.7;
  padding: 5px;
    }
    
    @keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
    }
  </style>
</head>

<body>

  <h1>IS MEMPHIS DEPAY FIT?</h1>

  <div class="card">

    <img src="memphisoren.jpeg" />

    <div class="status" id="status" onclick="revealStatus()" style="cursor:pointer;">
  ❓
    </div>

    <div class="sound" id="sound">
  Tik om te onthullen
    </div>

    <div class="info">
      Laatst bijgewerkt: 29 mei 2026 - 14:32<br>
      Fit streak: 3 dagen<br>
      Bron: collectieve Oranje-paniek & nationaal onderbuikgevoel 😅
    </div>

    <div class="buttons" style="display:none;">
  <button class="yes" onclick="setFit(true)">
    JA
  </button>

  <button class="no" onclick="setFit(false)">
    NEE
  </button>

  <button onclick="startFeesttent()">
    🇳🇱 FEESTTENTMODUS
  </button>
    </div>

  <div class="footer">
  Blijkbaar is dit belangrijker dan de uitslag van Oranje 😅
</div>

<audio id="feesttent-audio">
  <source src="feesttent.mp3" type="audio/mpeg">
</audio>

<script>

window.onload = () => {
  const status = document.getElementById("status");
  const sound = document.getElementById("sound");

  status.innerText = "❓";
  status.style.color = "orange";

  sound.innerText = "Tik om te onthullen";
};

function setFit(isFit) {
  const status = document.getElementById("status");
  const sound = document.getElementById("sound");

  localStorage.setItem("depayFit", isFit);

  if (isFit) {
    status.innerText = "🟢 JA";
    status.style.color = "lime";
    sound.innerHTML = `
🇳🇱🇳🇱🇳🇱 YEEEEJ 🇳🇱🇳🇱🇳🇱<br>
👈👈 NAAR LINKS 👈👈<br>
👉👉 NAAR RECHTS 👉👉
`;
  } else {
    status.innerText = "🔴 NEE";
    status.style.color = "red";
    sound.innerHTML = `
🚨🚨 ORANJE PANIEKMODUS 🚨🚨<br>
😭😭 MEMPHIS NOG NIET FIT 😭😭<br>
🧃 ORANJE IN VLOEIBARE VORM 🧃
`;

function startFeesttent() {
  const audio = document.getElementById("feesttent-audio");

  audio.currentTime = 0;
  audio.play();
}

function revealStatus() {
  setFit(false);
}

</script>

</body>
</html>
