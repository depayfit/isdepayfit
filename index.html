<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Is Memphis Depay Fit?</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #000;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    h1 {
      font-size: 40px;
      margin-bottom: 20px;
    }

    .card {
      background: #111;
      border: 2px solid orange;
      border-radius: 20px;
      overflow: hidden;
      width: 90%;
      max-width: 500px;
    }

    img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .status {
      font-size: 80px;
      font-weight: bold;
      margin: 20px 0;
      color: lime;
    }

    .btn {
      font-size: 40px;
      padding: 20px 40px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      margin: 10px;
    }

    .yes {
      background: green;
      color: white;
    }

    .no {
      background: red;
      color: white;
    }

    .info {
      font-size: 14px;
      opacity: 0.7;
      margin: 15px;
    }

    .sound {
      font-size: 20px;
      margin-bottom: 10px;
      color: orange;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>IS MEMPHIS DEPAY FIT?</h1>

  <div class="card">

    <img src="https://upload.wikimedia.org/wikipedia/commons/1/1a/Memphis_Depay_2018.jpg" />

    <div class="status" id="status">🟢 JA</div>

    <div class="sound" id="sound">YEEEEJ 🇳🇱</div>

    <div class="info">
      Laatst bijgewerkt: 29 mei 2026 - 14:32<br/>
      Fit streak: 3 dagen<br/>
      Bron: KNVB / training update
    </div>

    <button class="btn yes" onclick="setFit(true)">JA</button>
    <button class="btn no" onclick="setFit(false)">NEE</button>

  </div>

  <script>
    function setFit(isFit) {
      const status = document.getElementById("status");
      const sound = document.getElementById("sound");

      if (isFit) {
        status.innerText = "🟢 JA";
        status.style.color = "lime";
        sound.innerText = "YEEEEJ 🇳🇱";
      } else {
        status.innerText = "🔴 NEE";
        status.style.color = "red";
        sound.innerText = "AHHH 😭";
      }
    }
  </script>

</body>
</html>
